# Shadow mode: REAL public market data from Binance COIN-M, SIMULATED account. No real orders are possible.
mode: shadow

# Strategy: regime_hedge_v1 was REJECTED by the V2 study (docs/strategy_v2.md §6.1) — static
# hedging beat it on the full period, out-of-sample, walk-forward fold wins and trade count.
#
# The ratio below was REVIEWED AND CONFIRMED by the owner on 2026-09-11 against the full
# frontier table (docs/strategy_v3_static_ratio.md §4, §6.1, §8). It is a stated risk preference,
# not a placeholder — and still not an optimisation result, because there is none. The V3 study
# (docs/strategy_v3_static_ratio.md) found NO optimal static ratio exists in this data: the
# trade-off is linear (~0.33% BTC per 180 days per 1pp of drawdown reduction) and adjacent-grid
# noise is as large as the whole spread. 20% is chosen because across ALL 14 start-date windows
# it is the top of the band where the final BTC count is not dominated by WHEN you started
# (best/worst = 1.69x at 20%, versus 9.91x at 85%) - see §10. The earlier justification, "the one
# region that survives every robustness check", was withdrawn: that check required full-period BTC
# growth, and in this dataset that growth comes from the single 2022 drawdown.
#
# Raising it buys drawdown reduction and costs BTC in bull markets: at 85% the worst 2-year window
# ended at 0.284 BTC and -1bp/8h adverse funding turns it into a FAIL. Read §6 before changing it.
strategy:
  name: fixed_hedge
  fixed_hedge:
    ratio: "0.20"

risk:
  max_hedge_ratio: "0.85"
  max_daily_hedge_change: "0.20"
  min_rebalance_diff: "0.10"

data:
  exchange_info_path: data/raw/exchange_info.json
  symbol: BTCUSD_PERP
  pair: BTCUSD

backtest:                      # cost parameters reused by the paper exchange
  warmup_bars: 210
  cost:
    taker_fee_rate: "0.0005"
    maker_fee_rate: "0.0002"
    slippage_bps: "5"

exchange:
  name: paper
  environment: demo            # not used by the paper account; public data comes from production endpoints
  symbol: BTCUSD_PERP
  pair: BTCUSD
  paper_initial_btc: "1"
  recv_window_ms: 5000
  request_timeout_seconds: 10

execution:
  policy: market
  decision_time_utc: "00:05"
  poll_interval_seconds: 60
  decision_retry_seconds: 600   # retry a failed/blocked decision every 10 min until the next decision time
  client_order_id_prefix: biq

storage:
  database_url: sqlite:///state/shadow.sqlite3

monitoring:
  # Week one engaged SAFE_HOLD on day two and nobody knew for six days, because CRITICAL alerts
  # only reached a log file. An unattended run needs a channel that leaves the machine.
  # Credentials live in .env (BIQ_TELEGRAM_BOT_TOKEN / BIQ_TELEGRAM_CHAT_ID); if they are absent
  # the channel is skipped with a warning and the run continues on the log channel alone.
  alert_channels: [log, telegram]
