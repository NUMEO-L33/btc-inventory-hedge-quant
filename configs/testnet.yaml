# Testnet / demo mode: Binance COIN-M demo environment (https://demo-dapi.binance.com), demo API keys.
# Verified live on 2026-09-02/04 (order, fill, streams, funding settlement) — docs/exchange_api_verification.md
# §16-17. Run `python -m btc_inventory_quant testnet --once` and read the startup report before
# leaving it unattended; then `bash scripts/install_agent.sh testnet` keeps it running next to shadow.
# Known demo limits: no fundingRate history, rates differ from production, FUNDING_FEE truncated at 8 dp.
mode: testnet

# Strategy: regime_hedge_v1 was REJECTED by the V2 study (docs/strategy_v2.md §6.1).
# The ratio is the one the owner confirmed for shadow on 2026-09-11 (see configs/shadow.yaml for
# the full rationale and docs/strategy_v3_static_ratio.md §10): not an optimisation result — no
# optimal static ratio exists in this data — but the top of the band where the outcome is least
# dominated by the start date. Keep it identical to shadow: this agent exists to prove the real
# adapter path on a demo account, not to test a different ratio.
strategy:
  name: fixed_hedge
  fixed_hedge:
    ratio: "0.20"

risk:
  max_hedge_ratio: "0.85"
  max_daily_hedge_change: "0.20"
  min_rebalance_diff: "0.10"

data:
  exchange_info_path: data/raw/exchange_info.json
  symbol: BTCUSD_PERP
  pair: BTCUSD

backtest:
  warmup_bars: 210

exchange:
  name: binance_coinm
  environment: demo
  symbol: BTCUSD_PERP
  pair: BTCUSD
  expected_position_mode: ONE_WAY
  expected_margin_type: CROSSED
  expected_leverage: 1
  recv_window_ms: 5000
  request_timeout_seconds: 10
  max_retries: 5

execution:
  policy: market
  decision_time_utc: "00:05"
  poll_interval_seconds: 60
  decision_retry_seconds: 600   # retry a failed/blocked decision every 10 min until the next decision time
  order_timeout_seconds: 30
  client_order_id_prefix: biq

storage:
  database_url: sqlite:///state/testnet.sqlite3

monitoring:
  # As with shadow/live, keep a channel that leaves the machine. testnet places real orders, so a
  # silent stop is worse than for shadow. Without credentials (.env) it only logs a warning and
  # keeps running on the log channel.
  alert_channels: [log, telegram]
