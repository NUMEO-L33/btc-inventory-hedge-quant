# Testnet / demo mode: Binance COIN-M demo environment (https://demo-dapi.binance.com), demo API keys.
# Demo reachability and key procedure are PARTIAL in the official docs — run `python -m btc_inventory_quant testnet --once`
# and check the startup report before leaving it unattended.
mode: testnet

# Strategy: regime_hedge_v1 was REJECTED by the V2 study (docs/strategy_v2.md §6.1).
# The ratio below is a CONSERVATIVE DEFAULT, not an optimisation result — the V3 study
# (docs/strategy_v3_static_ratio.md) found no optimal static ratio exists in this data.
# 10-20% is the only region surviving every robustness check; see §6 before changing it.
strategy:
  name: fixed_hedge
  fixed_hedge:
    ratio: "0.20"

risk:
  max_hedge_ratio: "0.85"
  max_daily_hedge_change: "0.20"
  min_rebalance_diff: "0.10"

data:
  exchange_info_path: data/raw/exchange_info.json
  symbol: BTCUSD_PERP
  pair: BTCUSD

backtest:
  warmup_bars: 210

exchange:
  name: binance_coinm
  environment: demo
  symbol: BTCUSD_PERP
  pair: BTCUSD
  expected_position_mode: ONE_WAY
  expected_margin_type: CROSSED
  expected_leverage: 1
  recv_window_ms: 5000
  request_timeout_seconds: 10
  max_retries: 5

execution:
  policy: market
  decision_time_utc: "00:05"
  poll_interval_seconds: 60
  decision_retry_seconds: 600   # retry a failed/blocked decision every 10 min until the next decision time
  order_timeout_seconds: 30
  client_order_id_prefix: biq

storage:
  database_url: sqlite:///state/testnet.sqlite3

monitoring:
  # shadow/live 와 동일하게 기계 밖으로 나가는 채널을 둔다. testnet 은 실주문을 내므로 조용히
  # 멈추면 shadow 보다 더 곤란하다. 자격증명(.env)이 없으면 경고만 남기고 로그로 계속 돈다.
  alert_channels: [log, telegram]
